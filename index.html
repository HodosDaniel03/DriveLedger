<!DOCTYPE html>
<html lang="en" class="bg-canvas dark:bg-slate-950">

<head>
  <script>
    window.__loadDriveLedgerAdSense = function () {
      try {
        var existing = document.getElementById('driveledger-adsense-script');
        var raw = localStorage.getItem('shiftmetric_cookie_consent');
        var parsed = raw ? JSON.parse(raw) : null;
        if (!parsed || !parsed.advertising) {
          if (existing && existing.parentNode) existing.parentNode.removeChild(existing);
          return;
        }
        if (existing) return;
        var s = document.createElement('script');
        s.id = 'driveledger-adsense-script';
        s.async = true;
        s.crossOrigin = 'anonymous';
        s.src = 'https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6581535125716295';
        document.head.appendChild(s);
      } catch (e) { }
    };
    window.__loadDriveLedgerAdSense();
  </script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>DriveLedger — Independent Automotive Cost Intelligence</title>
  <meta name="description"
    content="5-year ownership costs, upcoming repairs, and fair workshop prices for any check-engine code. Independent automotive cost platform." />
  <meta name="theme-color" content="#F3F5F8" />
  <meta name="robots" content="index, follow" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/logo-512.png" />
  <link rel="preload" as="image" href="/driveledger-logo.png" />
  <link rel="preload" as="image" href="/driveledger-logo-dark.png" />
  <link rel="canonical" href="https://mydriveledger.com/" />
  <!-- Google AdSense & Affiliate Partner IDs are centrally managed in src/config/monetizationConfig.js -->
  <script>
    (function () {
      try {
        var theme = localStorage.getItem('driveledger_theme') || localStorage.getItem('shiftmetric_theme');
        var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (theme === 'dark' || ((!theme || theme === 'system') && prefersDark)) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      } catch (e) { }
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
    rel="stylesheet" />
  <link
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
    rel="stylesheet" />
</head>

<body
  class="bg-canvas font-body text-body antialiased selection:bg-primary-100 selection:text-primary-800 dark:bg-slate-950 dark:text-slate-300">
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
